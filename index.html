<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#D5E6EC"><meta name="description" content="Notera — a calm space for your study notes.">
  <title>Notera · Your study space</title>
  <link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" data-go="home" data-tab="home" aria-label="Notera home">
        <span class="brand-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="mark-n" d="M7.2 16.6V7.4l9.6 9.2V7.4"/><path class="mark-wave" d="M6 20c3.4-1.9 8.6-1.9 12 0"/></svg></span><span class="brand-word">notera</span>
      </button>
      <div class="top-actions">
        <span class="offline-pill" id="offlinePill"><i></i> Offline ready</span>
        <button class="icon-btn" id="quickCreate" aria-label="Create new item" title="Create"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      </div>
    </header>
    <main id="main" tabindex="-1" aria-live="polite"></main>
    <nav class="bottom-nav" aria-label="Main navigation">
      <button class="nav-item active" data-tab="home"><svg viewBox="0 0 24 24"><path class="fl" d="m3.5 10.2 8.5-7 8.5 7V19a1.5 1.5 0 0 1-1.5 1.5H15v-5.2a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v5.2H5A1.5 1.5 0 0 1 3.5 19z"/></svg><span>Home</span></button>
      <button class="nav-item" data-tab="library"><svg viewBox="0 0 24 24"><path class="fl" d="M4 4.8h5.3A2.7 2.7 0 0 1 12 7.5v12.7a2.4 2.4 0 0 0-2.4-2.4H4zM20 4.8h-5.3A2.7 2.7 0 0 0 12 7.5v12.7a2.4 2.4 0 0 1 2.4-2.4H20z"/></svg><span>Library</span></button>
      <button class="nav-item" data-tab="search"><svg viewBox="0 0 24 24"><circle class="fl" cx="10.8" cy="10.8" r="6.6"/><path d="m16 16 4.5 4.5"/></svg><span>Search</span></button>
      <button class="nav-item" data-tab="bookmarks"><svg viewBox="0 0 24 24"><path class="fl" d="M6.5 4.6A1.6 1.6 0 0 1 8.1 3h7.8a1.6 1.6 0 0 1 1.6 1.6V21L12 17.2 6.5 21z"/></svg><span>Saved</span></button>
      <button class="nav-item" data-tab="settings"><svg viewBox="0 0 24 24"><path class="fl" d="M10.3 3h3.4l.5 2.4a7 7 0 0 1 1.7 1l2.3-.8 1.7 3-1.8 1.6a7 7 0 0 1 0 2l1.8 1.6-1.7 3-2.3-.8a7 7 0 0 1-1.7 1l-.5 2.4h-3.4l-.5-2.4a7 7 0 0 1-1.7-1l-2.3.8-1.7-3 1.8-1.6a7 7 0 0 1 0-2L4.1 9.6l1.7-3 2.3.8a7 7 0 0 1 1.7-1z"/><circle class="hole" cx="12" cy="12" r="2.6"/></svg><span>Settings</span></button>
    </nav>
  </div>
  <div id="overlayRoot"></div><div id="toastRoot" class="toast-root" aria-live="polite"></div>
  <input id="imagePicker" type="file" accept="image/*" hidden>
  <script src="app.js"></script>
</body></html>
